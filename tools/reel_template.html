<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="FONTS_CSS">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#030817}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;font-family:'Barlow',Arial,sans-serif;
 background:linear-gradient(180deg,#071030 0%,#030817 100%)}
#glow{position:absolute;width:1400px;height:1400px;left:-160px;top:300px;border-radius:50%;
 background:radial-gradient(circle,rgba(45,100,255,0.42) 0%,rgba(45,100,255,0) 62%)}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(143,166,224,0.17) 1.6px,transparent 2px);background-size:36px 36px;
 -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.2) 50%,#000 100%)}
#logo{position:absolute;left:90px;top:150px;height:84px}
#tag{position:absolute;right:90px;top:172px;font-family:'Barlow Condensed';font-weight:600;font-size:26px;letter-spacing:.28em;color:#a9bdf0;border:2px solid rgba(61,123,255,.55);border-radius:999px;padding:12px 24px 11px}
#bar{position:absolute;left:90px;right:90px;bottom:330px;height:6px;border-radius:3px;background:rgba(143,166,224,.18);overflow:hidden}
#barfill{height:100%;width:0;background:#3D7BFF;box-shadow:0 0 18px #3D7BFF}
#handle{position:absolute;left:90px;right:90px;bottom:240px;display:flex;justify-content:space-between;font-size:34px;font-weight:600;color:#dfe7ff}
#handle b{color:#3D7BFF}
.scene{position:absolute;left:90px;right:90px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding-bottom:120px}
.line{font-family:'Barlow Condensed';font-weight:800;text-transform:uppercase;line-height:.98;will-change:transform,opacity}
.line .a{color:#3D7BFF}
.line.sub{font-family:'Barlow';font-weight:400;text-transform:none;font-size:46px;line-height:1.35;color:#c9d6f7;margin-top:28px}
.line.kick{font-family:'Barlow Condensed';font-weight:600;font-size:40px;letter-spacing:.3em;color:#a9bdf0;margin-bottom:18px}
.center{align-items:center;text-align:center}
.biglogo{width:760px}
.pill{display:inline-flex;align-items:center;gap:18px;background:#3D7BFF;border-radius:999px;padding:26px 48px;font-family:'Barlow Condensed';font-weight:800;font-size:64px;box-shadow:0 0 60px rgba(61,123,255,.6);margin-top:40px}
</style>
</head>
<body>
<div id="stage">
<div id="glow"></div><div id="dots"></div>
<img id="logo" src="LOGOFULL" alt="">
<div id="tag">TAGTEXT</div>
<div id="scenes"></div>
<div id="bar"><div id="barfill"></div></div>
<div id="handle"><span><b>#</b> sparkvision</span><span>@spark_visionn</span></div>
</div>
<script>
const DATA = __DATA__;
const LOGOMARK = "LOGOMARK";
const root = document.getElementById('scenes');
const els = [];
DATA.scenes.forEach((sc, si) => {
  const d = document.createElement('div');
  d.className = 'scene' + (sc.center ? ' center' : '');
  sc.lines.forEach((ln, li) => {
    let e;
    if (ln.logo) { e = document.createElement('img'); e.src = LOGOFULLSRC; e.className = 'line biglogo'; }
    else if (ln.pill) { e = document.createElement('div'); e.className = 'line'; e.innerHTML = '<span class="pill">' + ln.pill + '</span>'; }
    else {
      e = document.createElement('div');
      e.className = 'line' + (ln.cls ? ' ' + ln.cls : '');
      e.innerHTML = ln.t.replace(/\[\[(.+?)\]\]/g, '<span class="a">$1</span>');
      if (ln.size) e.style.fontSize = ln.size + 'px';
    }
    d.appendChild(e);
    els.push({ e, si, li });
  });
  root.appendChild(d);
});
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
window.setTime = (t) => {
  const T = DATA.duration;
  document.getElementById('barfill').style.width = (100 * t / T) + '%';
  const g = document.getElementById('glow');
  g.style.transform = `translate(${Math.sin(t * 0.6) * 120}px, ${Math.cos(t * 0.45) * 160}px) scale(${1 + 0.06 * Math.sin(t * 1.1)})`;
  els.forEach(({ e, si, li }) => {
    const sc = DATA.scenes[si];
    const st = sc.start + li * 0.16;
    const inP = sc.start === 0 ? 1 : ease((t - st) / 0.5);
    const outP = sc.end >= T ? 0 : ease((t - (sc.end - 0.3)) / 0.3);
    const op = inP * (1 - outP);
    e.style.opacity = op;
    e.style.transform = `translateY(${(1 - inP) * 60 - outP * 40}px)`;
    e.parentElement.style.visibility = (t >= sc.start - 0.05 && t <= sc.end + 0.05) ? 'visible' : 'hidden';
  });
};
window.setTime(0);
</script>
</body>
</html>
