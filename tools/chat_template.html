<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="FONTS_CSS">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#030817}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;font-family:'Barlow',Arial,sans-serif;
 background:linear-gradient(180deg,#071030 0%,#030817 100%)}
#glow{position:absolute;width:1300px;height:1300px;left:-110px;top:520px;border-radius:50%;
 background:radial-gradient(circle,rgba(45,100,255,0.30) 0%,rgba(45,100,255,0) 62%)}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(143,166,224,0.15) 1.6px,transparent 2px);background-size:36px 36px}
#caption{position:absolute;left:80px;right:140px;top:210px;font-family:'Barlow Condensed';font-weight:800;font-size:84px;line-height:1.02;text-transform:uppercase;text-align:center}
#caption .a{color:#3D7BFF}
#panel{position:absolute;left:70px;right:140px;top:500px;height:1080px;border-radius:44px;background:rgba(8,16,46,0.92);
 border:2px solid rgba(110,150,255,0.28);box-shadow:0 30px 90px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}
#head{display:flex;align-items:center;gap:22px;padding:28px 34px;border-bottom:2px solid rgba(143,166,224,0.16);flex:none}
#av{width:84px;height:84px;border-radius:50%;background:#2a3a73;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:36px;color:#dfe7ff}
#name{font-weight:600;font-size:42px}
#status{font-size:26px;color:#8fa3d6}
#msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;padding:30px 30px 36px;overflow:hidden}
.b{max-width:82%;padding:24px 32px;border-radius:36px;font-size:50px;line-height:1.25;transform-origin:bottom left}
.them{align-self:flex-start;background:#1c2a5c;color:#eef3ff;border-bottom-left-radius:10px}
.us{align-self:flex-end;background:#3D7BFF;color:#fff;border-bottom-right-radius:10px;transform-origin:bottom right}
.typing{display:flex;gap:10px;padding:28px 30px}
.typing i{width:14px;height:14px;border-radius:50%;background:#c9d6f7;display:block}
#handle{position:absolute;left:80px;right:80px;bottom:200px;display:flex;justify-content:space-between;align-items:center;font-size:34px;font-weight:600;color:#dfe7ff}
#handle img{height:64px}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;background:rgba(3,8,23,0.94);text-align:center;padding:0 90px}
#end img{width:700px}
#endline{font-family:'Barlow Condensed';font-weight:800;font-size:96px;line-height:1;text-transform:uppercase}
#endline .a{color:#3D7BFF}
#cta{background:#3D7BFF;border-radius:999px;padding:24px 48px;font-family:'Barlow Condensed';font-weight:800;font-size:58px;box-shadow:0 0 60px rgba(61,123,255,.6)}
</style>
</head>
<body>
<div id="stage">
<div id="glow"></div><div id="dots"></div>
<div id="caption"></div>
<div id="panel">
 <div id="head"><div id="av"></div><div><div id="name"></div><div id="status">online</div></div></div>
 <div id="msgs"></div>
</div>
<div id="handle"><img src="LOGOFULL" alt=""><span>@spark_visionn</span></div>
<div id="end"><img src="LOGOFULL" alt=""><div id="endline"></div><div id="cta"></div></div>
</div>
<script>
const D = __DATA__;
const acc = s => s.replace(/\[\[(.+?)\]\]/g, '<span class="a">$1</span>');
document.getElementById('caption').innerHTML = acc(D.caption);
document.getElementById('name').textContent = D.contact;
document.getElementById('av').textContent = D.contact.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
document.getElementById('endline').innerHTML = acc(D.end.line);
document.getElementById('cta').textContent = D.end.cta;
const box = document.getElementById('msgs');
const items = [];
D.messages.forEach(m => {
  if (m.typing !== false) {
    const ty = document.createElement('div');
    ty.className = 'b typing ' + m.from;
    ty.innerHTML = '<i></i><i></i><i></i>';
    box.appendChild(ty);
    items.push({ el: ty, typing: true, from: m.at - (m.typingFor || 0.7), to: m.at });
  }
  const b = document.createElement('div');
  b.className = 'b ' + m.from;
  b.innerHTML = acc(m.t);
  box.appendChild(b);
  items.push({ el: b, at: m.at });
});
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
window.setTime = t => {
  items.forEach(it => {
    if (it.typing) {
      const on = t >= it.from && t < it.to;
      it.el.style.display = on ? 'flex' : 'none';
      if (on) [...it.el.children].forEach((d, i) => d.style.opacity = 0.35 + 0.65 * Math.max(0, Math.sin((t * 6) - i * 0.9)));
    } else {
      const on = t >= it.at;
      it.el.style.display = on ? 'block' : 'none';
      const p = ease((t - it.at) / 0.22);
      it.el.style.transform = `scale(${0.7 + 0.3 * p})`;
      it.el.style.opacity = p;
    }
  });
  const e = document.getElementById('end');
  const p = ease((t - D.end.at) / 0.4);
  e.style.opacity = p; e.style.visibility = t >= D.end.at ? 'visible' : 'hidden';
  document.getElementById('caption').style.opacity = 1;
  const g = document.getElementById('glow');
  g.style.transform = `translate(${Math.sin(t * .6) * 90}px, ${Math.cos(t * .45) * 120}px)`;
};
window.setTime(0);
</script>
</body>
</html>
